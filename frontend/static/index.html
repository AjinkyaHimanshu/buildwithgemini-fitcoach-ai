<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCoach AI</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#0d9488; --accent-dark:#0f766e; --accent-gradient:linear-gradient(135deg, #0d9488, #0284c7); --bg:#f1f5f9; --border:#e2e8f0; --user-bg:#0d9488; --user-text:#ffffff; --agent-bg:#ffffff; --agent-border:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; height:100vh; color:#0f172a; }
  .chat-app { display:flex; flex-direction:column; width:100%; max-width:820px; height:100vh; background:#ffffff; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); }
  @media (min-width:768px) { .chat-app { height:92vh; border-radius:16px; overflow:hidden; border:1px solid var(--border); } }
  header { background:var(--accent-gradient); color:#fff; padding:1.1rem 1.5rem; font-weight:700; font-size:1.25rem; letter-spacing:0.01em; box-shadow:0 2px 10px rgba(13,148,136,0.2); display:flex; align-items:center; justify-content:space-between; }
  header .subtitle { font-size:0.8rem; font-weight:400; opacity:0.9; margin-left: auto; background:rgba(255,255,255,0.15); padding:0.25rem 0.6rem; border-radius:12px; }
  #log { flex:1; overflow-y:auto; padding:1.4rem; display:flex; flex-direction:column; gap:1rem; background:#f8fafc; }
  .msg { display:flex; align-items:flex-end; gap:0.6rem; width:100%; }
  .msg.user { flex-direction:row-reverse; }
  .avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.05rem; flex-shrink:0; background:#e2e8f0; color:#334155; }
  .msg.user .avatar { background:linear-gradient(135deg, #0d9488, #0284c7); color:#fff; }
  .msg.agent .avatar { background:#0f172a; color:#fff; }
  .bubble { display:inline-block; padding:0.75rem 1.1rem; border-radius:18px 18px 18px 4px; background:var(--agent-bg); border:1px solid var(--agent-border); text-align:left; max-width:82%; white-space:normal; box-shadow:0 2px 6px rgba(0,0,0,0.04); font-size:0.96rem; line-height:1.5; color:#334155; }
  .msg.user .bubble { background:var(--accent-gradient); color:var(--user-text); border:none; border-radius:18px 18px 4px 18px; box-shadow:0 3px 10px rgba(13,148,136,0.2); }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; white-space:normal; box-shadow:none; }
  form { display:flex; gap:0.6rem; padding:1rem 1.2rem; border-top:1px solid var(--border); background:#ffffff; align-items:center; }
  input { flex:1; padding:0.8rem 1.1rem; border:1.5px solid var(--border); border-radius:24px; font-size:0.96rem; outline:none; transition:all 0.2s ease; background:#f8fafc; }
  input:focus { border-color:var(--accent); background:#ffffff; box-shadow:0 0 0 3px rgba(13,148,136,0.15); }
  button { padding:0.75rem 1.3rem; border:none; border-radius:24px; background:var(--accent-gradient); color:#fff; font-weight:600; cursor:pointer; font-size:0.95rem; transition:transform 0.15s ease, box-shadow 0.15s ease; box-shadow:0 2px 6px rgba(13,148,136,0.25); display:flex; align-items:center; gap:0.3rem; }
  button:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(13,148,136,0.35); }
  button:active { transform:translateY(0); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:14px; padding:1.1rem; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.05); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:#666; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  /* Prompt Chips */
  .suggestions-row { display:flex; gap:.5rem; padding:.7rem 1.2rem .4rem; background:#ffffff; justify-content:flex-start; overflow-x:auto; border-top:1px solid #f1f5f9; }
  .chip { padding:.45rem .9rem; font-size:.84rem; border:1px solid var(--border); border-radius:20px; background:#f8fafc; color:#334155; cursor:pointer; font-weight:500; transition:all 0.15s ease-in-out; white-space:nowrap; }
  .chip:hover { background:var(--accent); color:#fff; border-color:var(--accent); transform:translateY(-1px); box-shadow:0 2px 6px rgba(13,148,136,0.2); }
</style>
</head>
<body>
<div class="chat-app">
  <header>
    <span>🏋️‍♂️ FitCoach AI</span>
    <span class="subtitle">AI Fitness Assistant</span>
  </header>
  <div id="log"></div>
  <div id="suggestions" class="suggestions-row">
    <button type="button" class="chip" data-prompt="Create a 45-minute dumbbell upper body workout for an intermediate lifter">🏋️ 45-min Workout</button>
    <button type="button" class="chip" data-prompt="Calculate target heart rate zones for age 30 with resting HR 60">🔥 Target HR Zones</button>
    <button type="button" class="chip" data-prompt="Generate an exercise form guide image for Dumbbell Bicep Curl">🖼️ Bicep Curl Form</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask FitCoach AI something…" autocomplete="off" autofocus>
    <button>Send ➔</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🤖");
  const b = el("div", "bubble");
  m.appendChild(avatar);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function formatMarkdown(text) {
  if (!text) return "";
  let safe = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  
  safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/__(.*?)__/g, '<strong>$1</strong>');
  safe = safe.replace(/\*(.*?)\*/g, '<em>$1</em>');
  safe = safe.replace(/^### (.*$)/gim, '<h3 style="margin:.4rem 0;font-size:1.1rem">$1</h3>');
  safe = safe.replace(/^## (.*$)/gim, '<h2 style="margin:.5rem 0;font-size:1.2rem">$1</h2>');
  safe = safe.replace(/^# (.*$)/gim, '<h1 style="margin:.6rem 0;font-size:1.35rem">$1</h1>');
  safe = safe.replace(/^\s*\d+\.\s+(.*$)/gim, '<li style="margin-left:1.2rem;list-style-type:decimal;">$1</li>');
  safe = safe.replace(/^\s*[-*]\s+(.*$)/gim, '<li style="margin-left:1.2rem;list-style-type:disc;">$1</li>');
  safe = safe.replace(/\n\n/g, '<div style="margin-bottom:.5rem;"></div>');
  safe = safe.replace(/\n/g, '<br>');
  return safe;
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const textDiv = el("div");
    textDiv.innerHTML = formatMarkdown(textStr);
    b.appendChild(textDiv);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      const fallbackDiv = el("div");
      fallbackDiv.innerHTML = formatMarkdown(flattenText(a2ui) || "(no card content)");
      b.appendChild(fallbackDiv);
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    input.value = chip.getAttribute("data-prompt") || chip.textContent;
    if (form.requestSubmit) {
      form.requestSubmit();
    } else {
      form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
    }
  });
});
</script>
</body>
</html>
